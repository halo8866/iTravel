name: Build & Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 计算版本号
        id: version
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.0")
          echo "Latest tag: $LATEST_TAG"
          VERSION=${LATEST_TAG#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          PATCH=$((PATCH + 1))
          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          echo "VERSION_NAME=${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "VERSION_CODE=${VERSION_CODE}" >> $GITHUB_OUTPUT
          echo "TAG_NAME=v${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "New version: v${NEW_VERSION} (code ${VERSION_CODE})"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: 检查环境
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "JAVA_HOME=$JAVA_HOME"
          java -version

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        env:
          VERSION_CODE: ${{ steps.version.outputs.VERSION_CODE }}
          VERSION_NAME: ${{ steps.version.outputs.VERSION_NAME }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --console=plain --stacktrace 2>&1 | tee build-output.log
          echo "=== BUILD EXIT: ${PIPESTATUS[0]} ==="
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "=== BUILD FAILED, last 80 lines ==="
            tail -n 80 build-output.log
            exit 1
          fi

      - name: 上传构建日志（失败时）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-output.log
          retention-days: 7

      - name: 重命名 APK
        if: success()
        run: |
          echo "=== APK 目录内容 ==="
          ls -la app/build/outputs/apk/debug/
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          echo "Found APK: $APK"
          mv "$APK" "app/build/outputs/apk/debug/itravel-${{ steps.version.outputs.VERSION_NAME }}-debug.apk"

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: itravel-${{ steps.version.outputs.VERSION_NAME }}-debug
          path: app/build/outputs/apk/debug/itravel-*-debug.apk
          retention-days: 30

      - name: Create Release
        if: success()
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.TAG_NAME }}
          release_name: ${{ steps.version.outputs.TAG_NAME }}
          body: |
            iTravel ${{ steps.version.outputs.VERSION_NAME }}
            自动构建的 debug APK

            构建时间: ${{ github.event.head_commit.timestamp }}
            提交: ${{ github.sha }}
          draft: false
          prerelease: false

      - name: Upload Release Asset
        if: success()
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: app/build/outputs/apk/debug/itravel-${{ steps.version.outputs.VERSION_NAME }}-debug.apk
          asset_name: itravel-${{ steps.version.outputs.VERSION_NAME }}-debug.apk
          asset_content_type: application/vnd.android.package-archive
